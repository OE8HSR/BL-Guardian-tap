[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bluelab-guardian"
version = "0.1.0"
description = "Read a Bluelab Guardian Monitor over its USB-UART tap"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["bluelab*"]
